name: Go
on: [push]
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@v1
    - name: Install tools
      run: |
        make install
        echo "PATH=$(go env GOPATH)/bin:$PATH" >> $GITHUB_ENV
    - name: Install buf
      run: |
        URL=$(curl -s https://api.github.com/repos/bufbuild/buf/releases/latest | jq -r '.assets[] | select(.name=="buf-Linux-x86_64") | .browser_download_url')
        echo "Download URL: $URL"
        curl -sSL "$URL" -o /usr/local/bin/buf
        chmod +x /usr/local/bin/buf
    - name: Regenerate files
      run: make generate
    - name: Tidy
      run: go mod tidy
    - name: Build
      run: go build -v ./...
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@v1
    - name: Install tools
      run: make install
    - name: Install buf
      run: |
        URL=$(curl -s https://api.github.com/repos/bufbuild/buf/releases/latest | jq -r '.assets[] | select(.name=="buf-Linux-x86_64") | .browser_download_url')
        echo "Download URL: $URL"
        curl -sSL "$URL" -o /usr/local/bin/buf
        chmod +x /usr/local/bin/buf
    - name: Lint
      run: make lint
