name: Go
on: [push]
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@v6.0.2
    - name: Install tools
      run: |
        make install
        echo "PATH=$(go env GOPATH)/bin:$PATH" >> $GITHUB_ENV
    - name: Install buf
      run: |
        URL=$(curl -s https://api.github.com/repos/bufbuild/buf/releases/latest | jq -r '.assets[] | select(.name=="buf-Linux-x86_64") | .browser_download_url')
        curl -sSL "$URL" -o /usr/local/bin/buf
        chmod +x /usr/local/bin/buf
    - name: Regenerate files
      run: make generate
    - name: Tidy
      run: go mod tidy
    - name: Build
      run: go build -v ./...
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      mariadb:
        # Matches the forum's major version and testdb/compose.yaml.
        image: mariadb:11.5
        env:
          # Throwaway credential for disposable fixture data; mirrored in
          # testdb/testdb.go and testdb/compose.yaml.
          MARIADB_ROOT_PASSWORD: harness
        ports:
          - 3310:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=24
    steps:
    - name: Check out code
      uses: actions/checkout@v6.0.2
    - name: Test (no harness — integration tests must skip)
      run: go test ./...
    - name: Test with MariaDB harness
      run: go test ./...
      env:
        TESTDB_ADDR: 127.0.0.1:3310
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@v6.0.2
    - name: Install tools
      run: make install
    - name: Install buf
      run: |
        URL=$(curl -s https://api.github.com/repos/bufbuild/buf/releases/latest | jq -r '.assets[] | select(.name=="buf-Linux-x86_64") | .browser_download_url')
        curl -sSL "$URL" -o /usr/local/bin/buf
        chmod +x /usr/local/bin/buf
    - name: Lint
      run: make lint
