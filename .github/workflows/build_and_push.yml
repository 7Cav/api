name: Build and Push Docker Image

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.0

      # The release tag reaches the served OpenAPI spec at runtime: the binary's
      # `version` var (ldflags via Dockerfile ARG VERSION) is stamped onto the
      # hand-owned spec's info.version when DocsHandler serves it. Phase 4 (#135)
      # retired the proto sources and the build-time `make generate`, so there is
      # no proto-version sed step here anymore.

      - name: Log in to Docker Hub
        uses: docker/login-action@v4.3.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: |
            7cav/api:${{ github.ref_name }}
            7cav/api:latest

      - name: Force Watchtower Update
        run: |
          curl -H "Authorization: Bearer ${{ secrets.WATCHER_KEY }}" https://watcher.7cav.us/v1/update
