version: v2
modules:
  - path: proto
    name: github.com/7cav/api
deps:
  - buf.build/googleapis/googleapis
  - buf.build/grpc-ecosystem/grpc-gateway
lint:
  use:
    - STANDARD
  except:
    - ENUM_FIRST_VALUE_ZERO
    - FIELD_NOT_REQUIRED
    - IMPORT_USED
    - PACKAGE_NO_IMPORT_CYCLE
    - PROTOVALIDATE
    - SYNTAX_SPECIFIED
  ignore_only:
    PACKAGE_DIRECTORY_MATCH:
      - proto/milpacs.proto
      - proto/tickets.proto
    PACKAGE_VERSION_SUFFIX:
      - proto/milpacs.proto
      - proto/tickets.proto
    RPC_REQUEST_RESPONSE_UNIQUE:
      - proto/milpacs.proto
      - proto/tickets.proto
    RPC_REQUEST_STANDARD_NAME:
      - proto/milpacs.proto
      - proto/tickets.proto
    RPC_RESPONSE_STANDARD_NAME:
      - proto/milpacs.proto
      - proto/tickets.proto
  disallow_comment_ignores: true
breaking:
  except:
    - EXTENSION_NO_DELETE
    - FIELD_SAME_DEFAULT
