syntax = "proto3";

package proto;

option go_package = "github.com/7cav/api/proto";

import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "google/protobuf/empty.proto";

// These annotations are used when generating the OpenAPI file.
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info: {
    version: "1.5.0";
  };
  external_docs: {
    url: "https://github.com/7cav/api";
    description: "7Cav API Repository";
  }
  schemes: HTTPS;
  security_definitions: {
    security: {
      key: "bearer"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "Authorization"
        description: "Authentication token, prefixed by Bearer: Bearer <token>"
      }
    }
  }
  security: {
    security_requirement: {
      key: "bearer"
    }
  }
};

service MilpacService {
  rpc GetProfile(ProfileRequest) returns (Profile){
    option(google.api.http) = {
      get: "/api/v1/milpacs/profile/id/{user_id}"
      additional_bindings: [
        {
          get: "/api/v1/milpacs/profile/username/{username}"
        }
      ]
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Get given user milpac Profile"
      description: "Get milpac Profile data for a specific user"
      tags: "Users, Milpacs, Profile"
    };
  };
  rpc GetRoster(RosterRequest) returns (Roster){
    option(google.api.http) = {
      get: "/api/v1/roster/{roster}"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Get a given roster"
      description: "Get all milpac Profile data for a given roster"
      tags: "Roster, Milpacs"
    };
  };
  rpc GetUserViaKeycloakId(KeycloakIdRequest) returns (Profile){
    option(google.api.http) = {
      get: "/api/v1/milpac/keycloak/{keycloak_id}"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Get a Milpac profile via keycloak ID"
      description: "Get all milpac Profile data for a given user via their Keycloak ID"
      tags: "Roster, Milpacs, Keycloak"
    };
  };
  rpc GetUserViaDiscordId(DiscordIdRequest) returns (Profile){
    option(google.api.http) = {
      get: "/api/v1/milpac/discord/{discord_id}"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Get a Milpac profile via Discord ID"
      description: "Get all milpac Profile data for a given user via their Discord ID"
      tags: "Roster, Milpacs, Discord"
    };
  };
  rpc GetLiteRoster(RosterRequest) returns (LiteRoster){
    option(google.api.http) = {
      get: "/api/v1/roster/{roster}/lite"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Get a given roster with minimal profile data"
      description: "Get basic milpac Profile data for a given roster, excluding records and awards"
      tags: "Roster, Milpacs"
    };
  };
  rpc SearchByPosition(PositionSearchRequest) returns (LiteRoster) {
    option(google.api.http) = {
      get: "/api/v1/milpacs/position/search/{position_query=**}"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Search for profiles by position title"
      description: "Search for profiles using fuzzy matching on primary and secondary position titles, returns lite profiles for efficiency"
      tags: "Users, Milpacs, Position"
    };
  };
  rpc GetS1UniformsRoster(RosterRequest) returns (S1UniformsRoster){
    option(google.api.http) = {
      get: "/api/v1/s1/uniforms/{roster}"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Get a given roster with minimal profile data"
      description: "Get the specified roster with data tailored for S1 Uniforms"
      tags: "Roster, Milpacs, S1"
    };
  };
  rpc GetAllRanks(google.protobuf.Empty) returns (RanksResponse) {
    option(google.api.http) = {
      get: "/api/v1/milpacs/ranks"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Get all ranks"
      description: "Get a list of all ranks and their details"
      tags: "Ranks, Milpacs"
    };
  };

  rpc GetPositionGroups(google.protobuf.Empty) returns (PositionGroupsResponse) {
    option(google.api.http) = {
      get: "/api/v1/milpacs/position/groups"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Get all position groups with positions"
      description: "Get a hierarchical list of all position groups and their associated positions"
      tags: "Positions, Milpacs"
    };
  };
  rpc GetAwol(google.protobuf.Empty) returns (AwolResponse) {
    option(google.api.http) = {
      get: "/api/v1/milpacs/awol"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Get all AWOL troopers"
      description: "Get a list of all troopers that havent posted in the last 7 days"
      tags: "AWOLs, Milpacs"
    };
  };
}





enum RosterType {
  ROSTER_TYPE_UNSPECIFIED = 0;
  ROSTER_TYPE_COMBAT = 1;
  ROSTER_TYPE_RESERVE = 2;
  ROSTER_TYPE_ELOA = 3;
  ROSTER_TYPE_WALL_OF_HONOR = 4;
  ROSTER_TYPE_ARLINGTON = 5;
  ROSTER_TYPE_PAST_MEMBERS = 6;
}

enum RecordType {
  RECORD_TYPE_UNSPECIFIED = 0;
  RECORD_TYPE_PROMOTION = 1;
  RECORD_TYPE_OPERATION = 2;
  RECORD_TYPE_TRANSFER = 3;
  RECORD_TYPE_DISCIPLINARY = 4;
  RECORD_TYPE_DISCHARGE = 5;
  RECORD_TYPE_ASSIGNMENT = 6;
  RECORD_TYPE_NAME_CHANGE = 7;
  RECORD_TYPE_ELOA = 8;
  RECORD_TYPE_GRADUATION = 9;
}

enum RankType {
  RANK_TYPE_UNSPECIFIED = 0;
  RANK_TYPE_GOA = 1;
  RANK_TYPE_GEN = 2;
  RANK_TYPE_LTG = 3;
  RANK_TYPE_MG  = 4;
  RANK_TYPE_BG  = 5;
  RANK_TYPE_COL = 6;
  RANK_TYPE_LTC = 7;
  RANK_TYPE_MAJ = 8;
  RANK_TYPE_CPT = 9;
  RANK_TYPE_1LT = 10;
  RANK_TYPE_2LT = 11;
  RANK_TYPE_CSM = 12;
  RANK_TYPE_SGM = 13;
  RANK_TYPE_1SG = 14;
  RANK_TYPE_MSG = 15;
  RANK_TYPE_SFC = 16;
  RANK_TYPE_SSG = 17;
  RANK_TYPE_SGT = 18;
  RANK_TYPE_CPL = 19;
  RANK_TYPE_SPC = 20;
  RANK_TYPE_PFC = 21;
  RANK_TYPE_PVT = 22;
  RANK_TYPE_RCT = 23;
  RANK_TYPE_CW5 = 26;
  RANK_TYPE_CW4 = 27;
  RANK_TYPE_CW3 = 28;
  RANK_TYPE_CW2 = 29;
  RANK_TYPE_WO1 = 30;
  RANK_TYPE_AR  = 31;
}

message ProfileRequest {
  uint64 user_id = 1;
  string username = 2;
}

message KeycloakIdRequest {
  string keycloak_id = 1;
}

message DiscordIdRequest {
  string discord_id = 1;
}

message Rank {
  string rank_short = 1;
  string rank_full = 2;
  string rank_image_url = 3;
  uint64 rank_id = 4;
}

message Thingy {
  string ack = 1;
}

message Profile {
  User user = 1;
  Rank rank = 2;
  string real_name = 3;
  string uniform_url = 4;
  RosterType roster = 5;
  Position primary = 6;
  repeated Position secondaries = 7;
  repeated Record records = 8;
  repeated Award awards = 9;
  string join_date = 10;
  string promotion_date = 11;
  string keycloak_id = 12;
  string discord_id = 13;
  string last_forum_post_timestamp = 14;
}

message RosterRequest {
  RosterType roster = 1;
}

message Roster {
  map<uint64, Profile> profiles = 1;
}

message User {
  uint64 user_id = 1;
  string username = 2;
}

message Record {
  string record_details = 1;
  RecordType record_type = 2;
  string record_date = 3;
  uint64 record_uid = 4;
}

message Award {
  string award_details = 1;
  string award_name = 2;
  string award_date = 3;
  string award_image_url = 4;
  uint64 award_uid = 5;
}

message Position {
  string position_title = 1;
  uint64 position_id = 2;
}

message LiteProfile {
  User user = 1;
  Rank rank = 2;
  string real_name = 3;
  string uniform_url = 4;
  RosterType roster = 5;
  Position primary = 6;
  repeated Position secondaries = 7;
  string join_date = 8;
  string promotion_date = 9;
  string keycloak_id = 10;
  string discord_id = 11;
  string award_timestamp = 12;
  string record_timestamp = 13;
  string last_forum_post_timestamp = 14;
}

message LiteRoster {
  map<uint64, LiteProfile> profiles = 1;
}

message PositionSearchRequest {
  string position_query = 1;
}

message S1UniformsRoster {
  map<uint64, S1UniformsProfile> profiles = 1;
}

message S1UniformsProfile {
  User user = 1;
  S1UniformsRank rank = 2;
  string real_name = 3;
  string uniform_url = 4;
  string uniform_date = 5;
  string uniform_update_trigger_date = 6;
  RosterType roster = 7;
  string primary_position_title = 8;
  repeated S1UniformsPosition secondaries = 9;
  string join_date = 10;
  string promotion_date = 11;
  string area_of_responsibility = 12;
}

message S1UniformsRank {
  string rank_short = 1;
  string rank_full = 2;
  string rank_image_url = 3;
}

message S1UniformsPosition {
  string position_title = 1;
}

message RanksResponse {
  repeated RankExpanded ranks = 1;
}

message PositionGroupsResponse {
  repeated PositionGroup groups = 1;
}

message PositionGroup {
  uint64 group_id = 1;
  string group_title = 2;
  uint32 group_display_order = 3;
  repeated PositionExpanded positions = 4;
}

message RankExpanded {
  string rank_short = 1;
  string rank_full = 2;
  string rank_image_url = 3;
  uint64 rank_id = 4;
  uint32 rank_display_order = 5;
}

message PositionExpanded {
  string position_title = 1;
  uint64 position_id = 2;
  uint32 position_display_order = 3;
  bool position_possible_secondary = 4;
}

message AwolResponse {
  repeated Awol awols = 1;
}

message Awol {
  string group_name = 1;
  string rank_name = 2;
  string username = 3;
  uint64 user_id = 4;
  string human_date = 5;
  uint64 date = 6;
  uint64 post_id = 7;
}