server {
	listen 443 ssl http2 ;
	listen [::]:443 ssl http2 ;
	ssl_session_timeout 5m;
	ssl_session_cache shared:SSL:50m;
	ssl_session_tickets off;
	ssl_stapling on;
	ssl_stapling_verify on;
	add_header Strict-Transport-Security "max-age=31536000" always;

    ssl_certificate     /out/localhost.crt;
    ssl_certificate_key /out/localhost.key;

    proxy_pass_request_headers on;

    real_ip_header X-Forwarded-For;
    set_real_ip_from 172.17.0.0/16;
    ignore_invalid_headers on;
    
    # The gRPC second port (:10000) and its /proto. grpc_pass block were retired
    # in Phase 4 (#135). One upstream now: the HTTP listener on :11000.

    location / {
        proxy_pass http://go-api:11000;
        proxy_set_header Connection keep-alive;
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        real_ip_header X-Forwarded-For;
        set_real_ip_from 172.17.0.0/16;
    }
}
