<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>7Cav API</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" type="text/css" href="./theme.css" />
  </head>
  <body>
    <div id="app"></div>
    <script src="./scalar.standalone.js"></script>
    <script>
      Scalar.createApiReference("#app", {
        url: "./openapi.yaml",
        darkMode: true,
        hideDarkModeToggle: false,
        // No third-party AI egress: turn off the hosted "Ask AI" assistant
        // entirely, including on localhost.
        agent: { disabled: true },
      });
    </script>
  </body>
</html>
