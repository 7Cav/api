  /api/v1/milpacs/position/search/{positionQuery}:
    get:
      operationId: MilpacService_SearchByPosition
      summary: Search for profiles by position title
      # An empty profiles map is a valid result: {} means no current position
      # title contains the query.
      # The live route accepts multi-segment queries, so slashes inside the
      # query and a bare trailing slash also reach the handler. That is a form
      # an OpenAPI path template cannot express; this document records the
      # canonical single-segment form.
      description: >-
        Search for profiles by position title substring (SQL LIKE '%query%',
        case-insensitive, unanchored, against primary and secondary-capable
        position titles); returns lite profiles. An empty profiles map means
        no current position title contains the query. Terms follow the unit's
        own billet vocabulary (line leadership is "Section Leader" / "Platoon
        Leader"; there is no "Squad Leader" billet, so that query returns an
        empty map).
      tags: [milpacs]
      parameters:
        - name: positionQuery
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: >-
            Matching lite profiles keyed by milpac relation id; {} when
            nothing matches (200, never 404).
          headers:
            Vary:
              description: >-
                Cache-keying hint: the server selects the body encoding from
                Accept-Encoding, so a shared cache must store the gzip and
                identity variants under separate keys.
              schema:
                type: string
                const: Accept-Encoding
            Cache-Control:
              description: >-
                Freshness signal: data may be up to 10 minutes stale.
                Consumers may treat a response as fresh for 10 minutes
                between polls.
              schema:
                type: string
                const: max-age=600
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiteRoster'
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Error'

