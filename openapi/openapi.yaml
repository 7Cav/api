  /api/v1/tickets:
    get:
      operationId: TicketsService_ListTickets
      summary: List tickets
      description: >-
        List tickets matching optional filters. Cursor-paginated, sorted by
        last_modified_date DESC with ticket_id DESC as the tiebreaker (the
        cursor is stable under the non-unique sort key). Every query key is
        accepted in both
        lowerCamelCase and snake_case spellings (e.g. perPage / per_page);
        unknown query parameters are ignored. Multi-select filters repeat the
        param (?statusId=1&statusId=5); the comma-separated form is NOT
        supported.
      tags: [tickets]
      parameters:
        - name: categoryId
          in: query
          required: false
          schema:
            type: array
            items:
              type: integer
              minimum: 0
        - name: excludeSubcategories
          in: query
          required: false
          schema:
            type: boolean
        - name: ticketState
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
        - name: statusId
          in: query
          required: false
          schema:
            type: array
            items:
              type: integer
              minimum: 0
        - name: prefixId
          in: query
          required: false
          schema:
            type: array
            items:
              type: integer
              minimum: 0
        - name: assignedUserId
          in: query
          required: false
          schema:
            type: array
            items:
              type: integer
              minimum: 0
        - name: starterUserId
          in: query
          required: false
          schema:
            type: array
            items:
              type: integer
              minimum: 0
        - name: modifiedSince
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
        - name: includeHidden
          in: query
          required: false
          schema:
            type: boolean
        - name: perPage
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
        - name: afterCursor
          in: query
          required: false
          schema:
            type: string
            description: >-
              Opaque cursor; empty string = first page. Round-trip the
              nextCursor from the previous response.
      responses:
        "200":
          description: One page of tickets.
          headers:
            Cache-Control:
              description: >-
                Freshness signal: always served live — responses are
                stale immediately; do not cache.
              schema:
                type: string
                const: max-age=0
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListTicketsResponse'
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/tickets/{ticketId}:
    get:
      operationId: TicketsService_GetTicket
      summary: Get a ticket by numeric ID
      description: >-
        Fetch a single ticket by its integer ticket id. Response includes the
        first 10 messages (oldest first) and the total message count; use
        ListTicketMessages for the full thread.
      tags: [tickets]
      parameters:
        - name: ticketId
          in: path
          required: true
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: The ticket with its first messages.
