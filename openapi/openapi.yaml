  /api/v1/milpacs/position/search/{positionQuery}:
    get:
      operationId: MilpacService_SearchByPosition
      summary: Search for profiles by position title
      description: >-
        Search for profiles by position title substring (SQL LIKE '%query%'
        against primary and secondary-capable position titles); returns lite
        profiles. The live route is a multi-segment glob
        ({position_query=**}, proto/milpacs.proto): slashes inside the query
        and the bare trailing-slash form also reach the handler — forms an
        OpenAPI path template cannot express; this document records the
        canonical single-segment form.
      tags: [milpacs]
      parameters:
        - name: positionQuery
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: >-
            Matching lite profiles keyed by milpac relation id; {} when
            nothing matches (200, never 404).
          headers:
            Cache-Control:
              description: >-
                Freshness signal: data may be up to 10 minutes stale —
                consumers may treat a response as fresh for 10 minutes
                between polls.
              schema:
                type: string
                const: max-age=600
          content:
