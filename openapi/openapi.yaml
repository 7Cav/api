  /api/v1/tickets/{ticketId}/messages:
    get:
      operationId: TicketsService_ListTicketMessages
      summary: List messages on a ticket
      description: >-
        Paginated thread of messages for a single ticket, ordered by position
        ascending. An unknown ticket id yields an empty page, not 404. Query
        keys accept both lowerCamelCase and snake_case spellings.
      tags: [tickets]
      parameters:
        - name: ticketId
          in: path
          required: true
          schema:
            type: integer
            minimum: 0
            maximum: 4294967295
        - name: perPage
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 4294967295
        - name: afterCursor
          in: query
          required: false
          schema:
            type: string
            description: >-
              Opaque cursor; empty string = first page. Pagination is by
              message position ascending. A malformed cursor (one not produced
              by this API) is rejected with 400.
        - name: includeHidden
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: One page of the message thread.
          headers:
            Vary:
              description: >-
                Cache-keying hint: the server selects the body encoding from
                Accept-Encoding, so a shared cache must store the gzip and
                identity variants under separate keys.
              schema:
                type: string
                const: Accept-Encoding
            Cache-Control:
              description: >-
                Freshness signal: always served live. Responses are
                stale immediately; do not cache.
              schema:
                type: string
                const: max-age=0
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListTicketMessagesResponse'
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Error'

