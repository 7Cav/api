# OpenAPI 3.1 reference for the 7Cav public HTTP API: read-only JSON over
# HTTPS, with a bearer API key required on every endpoint.
#
# JSON conventions used throughout the responses below:
#   - Field names are lowerCamelCase.
#   - Every field is always present. An unset object is null, an unset string
#     is "", and an empty collection is [] or {}.
#   - 64-bit integers are sent as decimal strings; 32-bit integers as numbers.
#   - Enum fields are sent as their name; the unset value is *_UNSPECIFIED.
openapi: 3.1.0
info:
  title: 7Cav API
  # Unknown query parameters are ignored on every operation rather than
  # rejected: a request with an undeclared parameter is accepted, not a 400.
  # Tooling that flags this is seeing intended behavior, not a defect.
  description: >-
    Read-only access to 7Cav.us roster and forum data. All endpoints require a
    bearer API key.


    ## Get your API key


    Generate a key from the [7Cav API key
    manager](https://7cav.us/account/api-key) (members only). Enter it in the
    reference's authentication controls to try any endpoint. The docs send it as
    `Authorization: Bearer <key>`, so enter only the raw `cav7_…` key.
  version: dev
externalDocs:
  description: 7Cav API Repository
  url: https://github.com/7cav/api
servers:
  - url: https://api.7cav.us
tags:
  - name: milpacs
    description: Milpac profiles, rosters, ranks, positions and AWOL tracking.
  - name: tickets
    description: Read-only forum support tickets.
  - name: forum
    description: Forum reference data (permission-group directory).

security:
  - bearer: []

paths:
  /api/v1/milpacs/profile/id/{userId}:
    get:
      operationId: MilpacService_GetProfile
      summary: Get given user milpac Profile
      description: >-
        Get milpac Profile data for a specific user. The path value is the
        milpac relation id, not the forum user id.
      tags: [milpacs]
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9]+$'
            description: 64-bit id as a decimal string.
        - name: username
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: The full milpac profile.
          headers:
            Vary:
              description: >-
                Cache-keying hint: the server selects the body encoding from
                Accept-Encoding, so a shared cache must store the gzip and
                identity variants under separate keys.
              schema:
                type: string
                const: Accept-Encoding
            Cache-Control:
              description: >-
                Freshness signal: data may be up to 10 minutes stale.
                Consumers may treat a response as fresh for 10 minutes
                between polls.
              schema:
                type: string
                const: max-age=600
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        "500":
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'

