        default:
          $ref: '#/components/responses/Error'

components:
  securitySchemes:
    # http/bearer makes the docs UI auto-prepend "Bearer " so users paste only
    # the raw cav7_… key.
    bearer:
      type: http
      scheme: bearer
      description: >-
        7Cav API key (cav7_…), sent as `Authorization: Bearer <key>`.
        Members generate a key from the API key manager at
        https://7cav.us/account/api-key.
        Requests without the Bearer scheme receive a plain-text 401 naming
        the expected header form; unknown keys receive a generic plain-text
        401; valid keys lacking the operation's scope receive a JSON 403.

  parameters:
    # Roster enum path parameter: the endpoint accepts the enum NAME or its
    # NUMBER (e.g. ROSTER_TYPE_COMBAT and 1 return the same payload); anything
    # else is a 400. The zero value parses but the handler rejects it with
    # 'cannot request null roster type'.
    RosterPath:
      name: roster
      in: path
      required: true
      schema:
        # The explicit top-level type matters: it routes the value through
        # full JSON-schema validation, so a literal that is neither an enum
        # name nor a number is a request-contract violation (observed 400).
        type: string
        anyOf:
          - $ref: '#/components/schemas/RosterType'
          - type: string
            pattern: '^[0-9]+$'
            description: Numeric form of the RosterType enum.

  responses:
    # The plain-text 401 tier: scheme errors name the expected header form,
    # unknown keys get the generic line. No WWW-Authenticate challenge is sent.
    Unauthorized:
      description: >-
        Missing or invalid bearer credentials. Plain text, two tiers:
        "Unauthorized: expected 'Authorization: Bearer <key>' header" when
        the Bearer scheme is absent; "Unauthorized" for a well-formed but
        unknown key. Recorded 401 bodies carry a trailing newline
        (http.Error appends one).
      headers:
        X-Content-Type-Options:
          required: true
          schema:
            type: string
            const: nosniff
      content:
        text/plain:
          schema:
            type: string
    # Every non-401 error uses the JSON error shape below, with the code→HTTP
    # mapping 3→400, 5→404, 7→403, 13→500. Message strings are
    # handler-specific. Operations list an explicit entry per error status
    # they can return; `default` covers any other error status, which carries
    # this same shape.
    Error:
      description: >-
        JSON error body. `code` is a numeric status code (3 InvalidArgument →
        400, 5 NotFound → 404, 7 PermissionDenied → 403, 13 Internal → 500).
        `message` is a human-readable description of the failure.
      headers:
        Vary:
          description: >-
            Cache-keying hint: the server selects the body encoding from
            Accept-Encoding, so a shared cache must store the gzip and
            identity variants under separate keys.
          schema:
            type: string
            const: Accept-Encoding
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Status'

  schemas:
    # --- shared wire forms -------------------------------------------------
    Uint64String:
      type: string
      pattern: '^[0-9]+$'
      description: 64-bit integer serialized as a decimal string.

    Status:
      description: The JSON error body returned when a request fails.
      type: object
      properties:
        code:
          type: integer
          description: >-
            Numeric status code (3 invalid argument, 5 not found, 7 permission
            denied, 13 internal).
        message:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/Any'
      required: [code, message, details]
      additionalProperties: false

    Any:
      description: >-
        Additional structured error details. In practice this is always empty;
        no recorded response has populated it. The schema stays open because an
        entry, if present, carries an '@type' field plus type-specific fields
        determined by it.
      type: object
      properties:
        '@type':
          type: string
      additionalProperties: true

    # --- milpacs -----------------------------------------------------------
    RosterType:
      type: string
      enum:
        - ROSTER_TYPE_UNSPECIFIED
        - ROSTER_TYPE_COMBAT
        - ROSTER_TYPE_RESERVE
        - ROSTER_TYPE_ELOA
        - ROSTER_TYPE_WALL_OF_HONOR
        - ROSTER_TYPE_ARLINGTON
        - ROSTER_TYPE_PAST_MEMBERS

    RecordType:
      type: string
      enum:
        - RECORD_TYPE_UNSPECIFIED
        - RECORD_TYPE_PROMOTION
        - RECORD_TYPE_OPERATION
        - RECORD_TYPE_TRANSFER
        - RECORD_TYPE_DISCIPLINARY
        - RECORD_TYPE_DISCHARGE
        - RECORD_TYPE_ASSIGNMENT
        - RECORD_TYPE_NAME_CHANGE
        - RECORD_TYPE_ELOA
        - RECORD_TYPE_GRADUATION

    User:
      type: object
      properties:
        userId:
          $ref: '#/components/schemas/Uint64String'
        username:
          type: string
      required: [userId, username]
      additionalProperties: false

    Rank:
      type: object
      properties:
        rankShort:
          type: string
        rankFull:
          type: string
        rankImageUrl:
          type: string
        rankId:
          $ref: '#/components/schemas/Uint64String'
      required: [rankShort, rankFull, rankImageUrl, rankId]
      additionalProperties: false

    RankExpanded:
      type: object
      properties:
        rankShort:
          type: string
        rankFull:
          type: string
        rankImageUrl:
          type: string
        rankId:
          $ref: '#/components/schemas/Uint64String'
        rankDisplayOrder:
          type: integer
          minimum: 0
      required: [rankShort, rankFull, rankImageUrl, rankId, rankDisplayOrder]
      additionalProperties: false

    RanksResponse:
      type: object
      properties:
        ranks:
          type: array
          items:
            $ref: '#/components/schemas/RankExpanded'
      required: [ranks]
      additionalProperties: false

    ForumGroup:
      type: object
      properties:
        groupId:
          type: integer
          minimum: 0
        groupName:
          type: string
      required: [groupId, groupName]
      additionalProperties: false

    Position:
      type: object
      properties:
        positionTitle:
          type: string
        positionId:
          $ref: '#/components/schemas/Uint64String'
      required: [positionTitle, positionId]
      additionalProperties: false

    PositionExpanded:
      type: object
      properties:
        positionTitle:
          type: string
        positionId:
          $ref: '#/components/schemas/Uint64String'
        positionDisplayOrder:
          type: integer
          minimum: 0
        positionPossibleSecondary:
          type: boolean
      required: [positionTitle, positionId, positionDisplayOrder, positionPossibleSecondary]
      additionalProperties: false

    PositionGroup:
      type: object
      properties:
        groupId:
          $ref: '#/components/schemas/Uint64String'
        groupTitle:
          type: string
        groupDisplayOrder:
          type: integer
          minimum: 0
        positions:
          type: array
          items:
            $ref: '#/components/schemas/PositionExpanded'
      required: [groupId, groupTitle, groupDisplayOrder, positions]
      additionalProperties: false

    PositionGroupsResponse:
      type: object
      properties:
        groups:
          type: array
          items:
            $ref: '#/components/schemas/PositionGroup'
      required: [groups]
      additionalProperties: false

    Record:
      type: object
      properties:
        recordDetails:
          type: string
        recordType:
          $ref: '#/components/schemas/RecordType'
        recordDate:
          type: string
        recordUid:
          $ref: '#/components/schemas/Uint64String'
      required: [recordDetails, recordType, recordDate, recordUid]
      additionalProperties: false

    Award:
      type: object
      properties:
        awardDetails:
          type: string
        awardName:
          type: string
        awardDate:
          type: string
        awardImageUrl:
          type: string
        awardUid:
          $ref: '#/components/schemas/Uint64String'
      required: [awardDetails, awardName, awardDate, awardImageUrl, awardUid]
      additionalProperties: false

    # Nullable forms for object-typed fields: an unset object is sent as null,
    # so the profile shapes reference these instead of repeating the null
    # union inline.
    NullableUser:
      oneOf:
        - $ref: '#/components/schemas/User'
        - type: 'null'

    NullableRank:
      oneOf:
        - $ref: '#/components/schemas/Rank'
        - type: 'null'

    NullablePosition:
      oneOf:
        - $ref: '#/components/schemas/Position'
        - type: 'null'

    NullableS1UniformsRank:
      oneOf:
        - $ref: '#/components/schemas/S1UniformsRank'
        - type: 'null'

    # Every key below is always present. Unset objects are null (hence the
    # null unions on object-typed fields); unset strings are ""; empty
    # collections are [].
    Profile:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/NullableUser'
        rank:
          $ref: '#/components/schemas/NullableRank'
        realName:
          type: string
        uniformUrl:
          type: string
        roster:
          $ref: '#/components/schemas/RosterType'
        primary:
          $ref: '#/components/schemas/NullablePosition'
        secondaries:
          type: array
          items:
            $ref: '#/components/schemas/Position'
        records:
          type: array
          items:
            $ref: '#/components/schemas/Record'
        awards:
          type: array
          items:
            $ref: '#/components/schemas/Award'
        joinDate:
          type: string
        promotionDate:
          type: string
        discordId:
          type: string
        lastForumPostDate:
          type: string
        mos:
          type: string
        consoleGamertag:
          type: string
      required:
        - user
        - rank
        - realName
        - uniformUrl
        - roster
        - primary
        - secondaries
        - records
        - awards
        - joinDate
        - promotionDate
        - discordId
        - lastForumPostDate
        - mos
        - consoleGamertag
      additionalProperties: false

    LiteProfile:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/NullableUser'
        rank:
          $ref: '#/components/schemas/NullableRank'
        realName:
          type: string
        uniformUrl:
          type: string
        roster:
          $ref: '#/components/schemas/RosterType'
        primary:
          $ref: '#/components/schemas/NullablePosition'
        secondaries:
          type: array
          items:
            $ref: '#/components/schemas/Position'
        joinDate:
          type: string
        promotionDate:
          type: string
        discordId:
          type: string
        awardDate:
          type: string
        recordDate:
          type: string
        lastForumPostDate:
          type: string
        mos:
          type: string
        consoleGamertag:
          type: string
      required:
        - user
        - rank
        - realName
        - uniformUrl
        - roster
        - primary
        - secondaries
        - joinDate
        - promotionDate
        - discordId
        - awardDate
        - recordDate
        - lastForumPostDate
        - mos
        - consoleGamertag
      additionalProperties: false

    # profiles is a map: additionalProperties is the value schema. The key
    # format (decimal relation-id strings) is given in the property
    # description, since a key-pattern schema is not used here.
    Roster:
      type: object
      properties:
        profiles:
          type: object
          description: Profiles keyed by milpac relation id (64-bit ids as decimal strings).
          additionalProperties:
            $ref: '#/components/schemas/Profile'
      required: [profiles]
      additionalProperties: false

    LiteRoster:
      type: object
      properties:
        profiles:
          type: object
          description: Lite profiles keyed by milpac relation id (64-bit ids as decimal strings).
          additionalProperties:
            $ref: '#/components/schemas/LiteProfile'
      required: [profiles]
      additionalProperties: false

    S1UniformsRank:
      type: object
      properties:
        rankShort:
          type: string
        rankFull:
          type: string
        rankImageUrl:
          type: string
      required: [rankShort, rankFull, rankImageUrl]
      additionalProperties: false

    S1UniformsPosition:
      type: object
      properties:
        positionTitle:
          type: string
      required: [positionTitle]
      additionalProperties: false

    S1UniformsProfile:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/NullableUser'
        rank:
          $ref: '#/components/schemas/NullableS1UniformsRank'
        realName:
          type: string
        uniformUrl:
          type: string
        uniformDate:
          type: string
        uniformUpdateTriggerDate:
          type: string
        roster:
          $ref: '#/components/schemas/RosterType'
        primaryPositionTitle:
          type: string
        secondaries:
          type: array
          items:
            $ref: '#/components/schemas/S1UniformsPosition'
        joinDate:
          type: string
        promotionDate:
          type: string
        areaOfResponsibility:
          type: string
      required:
        - user
        - rank
        - realName
        - uniformUrl
        - uniformDate
        - uniformUpdateTriggerDate
        - roster
        - primaryPositionTitle
        - secondaries
        - joinDate
        - promotionDate
        - areaOfResponsibility
      additionalProperties: false

    S1UniformsRoster:
      type: object
      properties:
        profiles:
          type: object
          description: S1 uniforms profiles keyed by milpac relation id (64-bit ids as decimal strings).
          additionalProperties:
            $ref: '#/components/schemas/S1UniformsProfile'
      required: [profiles]
      additionalProperties: false

    Awol:
      type: object
      properties:
        groupName:
          type: string
        rankName:
          type: string
        username:
          type: string
        userId:
          $ref: '#/components/schemas/Uint64String'
        humanDate:
          type: string
        timestamp:
          $ref: '#/components/schemas/Uint64String'
        postId:
          $ref: '#/components/schemas/Uint64String'
        milpacId:
          $ref: '#/components/schemas/Uint64String'
      required: [groupName, rankName, username, userId, humanDate, timestamp, postId, milpacId]
      additionalProperties: false

    AwolResponse:
      type: object
      properties:
        awols:
          type: array
          items:
            $ref: '#/components/schemas/Awol'
      required: [awols]
      additionalProperties: false

    # --- tickets -----------------------------------------------------------
    # All tickets integers are 32-bit: JSON numbers on the wire (the
    # 64-bit-as-string convention applies only to 64-bit fields).
    Ticket:
      type: object
      properties:
        ticketId:
          type: integer
          minimum: 0
        ticketRef:
          type: string
        title:
          type: string
        categoryId:
          type: integer
          minimum: 0
        categoryTitle:
          type: string
        categoryAncestorIds:
          type: array
          items:
            type: integer
            minimum: 0
        ticketState:
          type: string
        statusId:
          type: integer
          minimum: 0
        statusName:
          type: string
        priorityId:
          type: integer
          minimum: 0
        priorityName:
          type: string
        prefixId:
          type: integer
          minimum: 0
        prefixName:
          type: string
        discussionState:
          type: string
        ticketLocked:
          type: boolean
        starterUserId:
          type: integer
          minimum: 0
        starterUsername:
          type: string
        assignedUserId:
          type: integer
          minimum: 0
        assignedUsername:
          type: string
        participants:
          type: array
          items:
            $ref: '#/components/schemas/TicketParticipant'
        startDate:
          type: integer
          minimum: 0
        lastMessageDate:
          type: integer
          minimum: 0
        lastMessageUserId:
          type: integer
          minimum: 0
        lastMessageUsername:
          type: string
        lastModifiedDate:
          type: integer
          minimum: 0
        replyCount:
          type: integer
          minimum: 0
        totalMessageCount:
          type: integer
          minimum: 0
          description: >-
            Total messages in this ticket including the starter post.
            Equivalent to replyCount + 1.
        customFields:
          type: object
          additionalProperties:
            type: string
        forumUrl:
          type: string
      required:
        - ticketId
        - ticketRef
        - title
        - categoryId
        - categoryTitle
        - categoryAncestorIds
        - ticketState
        - statusId
        - statusName
        - priorityId
        - priorityName
        - prefixId
        - prefixName
        - discussionState
        - ticketLocked
        - starterUserId
        - starterUsername
        - assignedUserId
        - assignedUsername
        - participants
        - startDate
        - lastMessageDate
        - lastMessageUserId
        - lastMessageUsername
        - lastModifiedDate
        - replyCount
        - totalMessageCount
        - customFields
        - forumUrl
      additionalProperties: false

    TicketParticipant:
      type: object
      properties:
        userId:
          type: integer
          minimum: 0
        lastReadDate:
          type: integer
          minimum: 0
      required: [userId, lastReadDate]
      additionalProperties: false

    Message:
      type: object
      properties:
        messageId:
          type: integer
          minimum: 0
        ticketId:
          type: integer
          minimum: 0
        userId:
          type: integer
          minimum: 0
        username:
          type: string
        messageDate:
          type: integer
          minimum: 0
        message:
          type: string
        messageState:
          type: string
        position:
          type: integer
          minimum: 0
        attachCount:
          type: integer
          minimum: 0
        lastEditDate:
          type: integer
          minimum: 0
        editCount:
          type: integer
          minimum: 0
      required:
        - messageId
        - ticketId
        - userId
        - username
        - messageDate
        - message
        - messageState
        - position
        - attachCount
        - lastEditDate
        - editCount
      additionalProperties: false

    Category:
      type: object
      properties:
        categoryId:
          type: integer
          minimum: 0
        title:
          type: string
        description:
          type: string
        parentCategoryId:
          type: integer
          minimum: 0
        depth:
          type: integer
          minimum: 0
        displayOrder:
          type: integer
          minimum: 0
        ticketCount:
          type: integer
          minimum: 0
      required: [categoryId, title, description, parentCategoryId, depth, displayOrder, ticketCount]
      additionalProperties: false

    GetTicketResponse:
      type: object
      properties:
        ticket:
          $ref: '#/components/schemas/Ticket'
        firstMessages:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        totalMessageCount:
          type: integer
          minimum: 0
          deprecated: true
          description: 'DEPRECATED: use ticket.totalMessageCount. Removal target: v2.3.0.'
      required: [ticket, firstMessages, totalMessageCount]
      additionalProperties: false

    ListTicketsResponse:
      type: object
      properties:
        tickets:
          type: array
          items:
            $ref: '#/components/schemas/Ticket'
        nextCursor:
          type: string
          description: Opaque cursor; empty when hasMore is false.
        hasMore:
          type: boolean
      required: [tickets, nextCursor, hasMore]
      additionalProperties: false

    ListTicketMessagesResponse:
      type: object
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        nextCursor:
          type: string
          description: Opaque cursor; empty when hasMore is false.
        hasMore:
          type: boolean
      required: [messages, nextCursor, hasMore]
      additionalProperties: false

    ListCategoriesResponse:
      type: object
      properties:
        categories:
          type: array
          items:
            $ref: '#/components/schemas/Category'
      required: [categories]
      additionalProperties: false
